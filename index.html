   ===================================================================== */
function createDemoRepo() {
  const clone = (x) => ({ ...x, languages: x.languages ? [...x.languages] : x.languages, tags: x.tags ? [...x.tags] : x.tags });
  const now = () => new Date();
  const store = {
    resources: DEMO_RESOURCES.map((r) => {
      const d = new Date(r.updatedAt + 'T09:00:00');
      return { ...clone(r), updatedAt: d, createdAt: d };
    }),
    categories: DEMO_CATEGORIES.map((c) => ({ ...c, createdAt: new Date('2026-06-01T09:00:00'), updatedAt: new Date('2026-06-01T09:00:00') })),
  };
  const wait = (ms = 200) => new Promise((r) => setTimeout(r, ms));
  let seq = 100;
  const find = (id) => {
    const r = store.resources.find((x) => x.id === id);
    if (!r) throw appError('not-found');
    return r;
  };
  return {
    mode: 'demo',
    async listCategories() { await wait(); return store.categories.map((c) => ({ ...c })); },
    async listPublished() { await wait(); return store.resources.filter((r) => r.status === 'published').map(clone); },
    async adminListResources() { await wait(); return store.resources.map(clone); },
    async getResource(id) { await wait(); return clone(find(id)); },
    async saveResource(id, data, expectedUpdatedAt) {
      await wait(300);
      if (!id) {
        const r = { ...clone(data), id: `demo-new-${++seq}`, createdAt: now(), updatedAt: now() };
        store.resources.push(r);
        return r.id;
      }
      const cur = find(id);
      if ((cur.updatedAt?.getTime() ?? null) !== expectedUpdatedAt) throw appError('conflict');
      Object.assign(cur, clone(data), { updatedAt: now() });
      return id;
    },
    async reorder(changes) {
      await wait(300);
      for (const c of changes) if ((find(c.id).updatedAt?.getTime() ?? null) !== c.expectedUpdatedAt) throw appError('conflict');
      for (const c of changes) Object.assign(find(c.id), { sortOrder: c.sortOrder, updatedAt: now() });
    },
    async saveCategory(id, data, expectedUpdatedAt) {
      await wait(250);
      if (!id) {
        store.categories.push({ ...data, id: `demo-cat-${++seq}`, createdAt: now(), updatedAt: now() });
        return;
      }
      const cur = store.categories.find((c) => c.id === id);
      if (!cur) throw appError('not-found');
      if (cur.updatedAt.getTime() !== expectedUpdatedAt) throw appError('conflict');
      Object.assign(cur, data, { updatedAt: now() });
    },
  };
}

/* =====================================================================
   Repository: Firebase (Cloud Firestore + Authentication)
   ===================================================================== */
async function createFirebaseRepo() {
  const c = CONFIG.FIREBASE || {};
  if (!['apiKey', 'authDomain', 'projectId', 'appId'].every((k) => typeof c[k] === 'string' && c[k].trim())) {
    throw appError('config');
  }
  const base = `https://www.gstatic.com/firebasejs/${CONFIG.FIREBASE_SDK_VERSION}/`;
  let appMod, fs;
  try {
    [appMod, fs] = await withTimeout(Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-firestore.js')]));
  } catch (e) {
    throw e.code === 'timeout' ? e : appError('sdk');
  }
  const app = appMod.initializeApp(c);
  const db = fs.getFirestore(app);
  let authMod = null, auth = null;

  const toDate = (v) => (v && typeof v.toDate === 'function' ? v.toDate() : null);
  const fromDoc = (snap) => {
    const d = snap.data();
    return { ...d, id: snap.id, createdAt: toDate(d.createdAt), updatedAt: toDate(d.updatedAt), verifiedAt: toDate(d.verifiedAt) };
  };
  const ms = (v) => (v && typeof v.toMillis === 'function' ? v.toMillis() : null);

  async function ensureAuth() {
    if (auth) return auth;
    try {
      authMod = await withTimeout(import(base + 'firebase-auth.js'));
    } catch (e) {
      throw e.code === 'timeout' ? e : appError('sdk');
    }
    auth = authMod.getAuth(app);
    return auth;
  }
  function uidOrThrow() {
    const uid = auth?.currentUser?.uid;
    if (!uid) throw appError('permission-denied');
    return uid;
  }

  return {
    mode: 'firebase',
    async listCategories() {
      const snap = await withTimeout(fs.getDocs(fs.collection(db, 'categories')));
      return snap.docs.map(fromDoc);
    },
    async listPublished() {
      // query เฉพาะ published เสมอ (Rules ไม่ใช่ตัวกรอง)
      const q = fs.query(fs.collection(db, 'resources'), fs.where('status', '==', 'published'));
      const snap = await withTimeout(fs.getDocs(q));
      return snap.docs.map(fromDoc);
    },
    async adminListResources() {
      const snap = await withTimeout(fs.getDocs(fs.collection(db, 'resources')));
      return snap.docs.map(fromDoc);
    },
    async getResource(id) {
      const snap = await withTimeout(fs.getDoc(fs.doc(db, 'resources', id)));
      if (!snap.exists()) throw appError('not-found');
      return fromDoc(snap);
    },
    async saveResource(id, data, expectedUpdatedAt) {
      const uid = uidOrThrow();
      const payload = {
        ...data,
        verifiedAt: data.verifiedAt ? fs.Timestamp.fromDate(data.verifiedAt) : null,
        updatedAt: fs.serverTimestamp(),
        updatedBy: uid,
      };
      // ใช้ transaction เพื่อให้รู้ผลจริงจากเซิร์ฟเวอร์ (ออฟไลน์จะล้มเหลว ไม่ค้างคิว)
      if (!id) {
        const ref = fs.doc(fs.collection(db, 'resources'));
        await withTimeout(fs.runTransaction(db, async (tx) => {
          tx.set(ref, { ...payload, createdAt: fs.serverTimestamp(), createdBy: uid });
        }));
        return ref.id;
      }
      const ref = fs.doc(db, 'resources', id);
      await withTimeout(fs.runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (!snap.exists()) throw appError('not-found');
        if (ms(snap.data().updatedAt) !== expectedUpdatedAt) throw appError('conflict');
        tx.update(ref, payload);
      }));
      return id;
    },
    // บันทึกลำดับใหม่หลายรายการในครั้งเดียว (ทั้งหมดสำเร็จหรือไม่สำเร็จพร้อมกัน)
    async reorder(changes) {
      const uid = uidOrThrow();
      await withTimeout(fs.runTransaction(db, async (tx) => {
        const refs = changes.map((c) => fs.doc(db, 'resources', c.id));
        const snaps = [];
        for (const ref of refs) snaps.push(await tx.get(ref));
        snaps.forEach((snap, i) => {
          if (!snap.exists()) throw appError('not-found');
          if (ms(snap.data().updatedAt) !== changes[i].expectedUpdatedAt) throw appError('conflict');
        });
        refs.forEach((ref, i) => tx.update(ref, { sortOrder: changes[i].sortOrder, updatedAt: fs.serverTimestamp(), updatedBy: uid }));
      }));
    },
    async saveCategory(id, data, expectedUpdatedAt) {
      uidOrThrow();
      if (!id) {
        const ref = fs.doc(fs.collection(db, 'categories'));
        await withTimeout(fs.runTransaction(db, async (tx) => {
          tx.set(ref, { ...data, createdAt: fs.serverTimestamp(), updatedAt: fs.serverTimestamp() });
        }));
        return;
      }
      const ref = fs.doc(db, 'categories', id);
      await withTimeout(fs.runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        if (!snap.exists()) throw appError('not-found');
        if (ms(snap.data().updatedAt) !== expectedUpdatedAt) throw appError('conflict');
        tx.update(ref, { ...data, updatedAt: fs.serverTimestamp() });
      }));
    },
    // ---- Authentication ----
    async onAuthChange(cb) {
      await ensureAuth();
      return authMod.onAuthStateChanged(auth, cb);
    },
    async signIn() {
      await ensureAuth();
      const provider = new authMod.GoogleAuthProvider();
      try {
        await authMod.signInWithPopup(auth, provider);
      } catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
          await authMod.signInWithRedirect(auth, provider);
        } else throw e;
      }
    },
    async signOut() { await ensureAuth(); await authMod.signOut(auth); },
    async isActiveAdmin(user) {
      const snap = await withTimeout(fs.getDoc(fs.doc(db, 'admins', user.uid)));
      return snap.exists() && snap.data().active === true;
    },
  };
}

/* =====================================================================
   สถานะแอป
   ===================================================================== */
const state = {
  repo: null,
  load: 'idle', // idle | loading | ready | error
  error: null,
  resources: [],
  categories: [],
  catMap: new Map(),
  publicStale: false,
  q: '',
  results: [],
  shown: 0,
};
const collator = new Intl.Collator(['th', 'en'], { sensitivity: 'base', numeric: true });

async function getRepo() {
  if (state.repo) return state.repo;
  if (CONFIG.MODE === 'demo') state.repo = createDemoRepo();
  else if (CONFIG.MODE === 'firebase') state.repo = await createFirebaseRepo();
  else throw appError('config', 'CONFIG.MODE ต้องเป็น demo หรือ firebase');
  return state.repo;
}

function setCategories(list) {
  state.categories = list.sort((a, b) => (a.sortOrder - b.sortOrder) || collator.compare(a.name, b.name));
  state.catMap = new Map(state.categories.map((c) => [c.id, c]));
}
function catName(id) {
  const c = id ? state.catMap.get(id) : null;
  return c ? loc(c, 'name') || null : null;
}

// ค้นหาได้ทั้งภาษาไทยและอังกฤษไม่ว่าจะเลือกภาษาใด
function indexResource(r) {
  const c = r.categoryId ? state.catMap.get(r.categoryId) : null;
  r._hay = norm([r.title, r.titleEn, r.description, r.descriptionEn, c?.name, c?.nameEn, r.province, PLACE_EN[r.province],
    r.district, PLACE_EN[r.district], r.sourceName, ...(r.tags || [])].join('\n'));
  return r;
}

// ลำดับที่เจ้าหน้าที่จัดไว้ (sortOrder น้อยอยู่บน) → ปรับปรุงล่าสุด → ID
function defaultCompare(a, b) {
  return ((a.sortOrder ?? 0) - (b.sortOrder ?? 0))
    || ((b.updatedAt?.getTime() || 0) - (a.updatedAt?.getTime() || 0))
    || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
}

async function loadPublicData() {
  state.load = 'loading';
  state.error = null;
  renderPublic();
  try {
    const repo = await getRepo();
    const [cats, res] = await Promise.all([repo.listCategories(), repo.listPublished()]);
    setCategories(cats);
    state.resources = res.filter((r) => r.status === 'published').map(indexResource).sort(defaultCompare);
    state.load = 'ready';
    state.publicStale = false;
  } catch (e) {
    console.error(e);
    state.resources = [];
    state.load = 'error';
    state.error = errorMessage(e);
  }
  renderPublic();
  route();
}

function filteredResults() {
  const terms = norm(state.q).split(/\s+/).filter(Boolean);
  if (!terms.length) return state.resources;
  return state.resources.filter((r) => terms.every((t) => r._hay.includes(t)));
}

/* =====================================================================
   URL state (?q= + hash) — ไม่ใช้ history routes
   ===================================================================== */
function readUrlState() {
  state.q = (new URLSearchParams(location.search).get('q') || '').slice(0, 200);
}
function buildUrl(hash = '') {
  const p = new URLSearchParams();
  if (state.q) p.set('q', state.q);
  const qs = p.toString();
  return location.pathname + (qs ? `?${qs}` : '') + hash;
}
let lastWasQueryReplace = false;
function writeUrl({ replace = false } = {}) {
  const url = buildUrl();
  if (url === location.pathname + location.search + location.hash) return;
  if (replace) history.replaceState(null, '', url);
  else history.pushState(null, '', url);
}

/* =====================================================================
   Public rendering
   ===================================================================== */
const els = {
  q: $('#q'), searchBar: $('#search-bar'), searchToggle: $('#search-toggle'), searchClear: $('#search-clear'),
  resultHead: $('#result-head'), count: $('#result-count'), resultClear: $('#result-clear'), listStatus: $('#list-status'),
  resultsState: $('#results-state'), grid: $('#results-grid'),
  loadMore: $('#load-more'), loadMoreText: $('#load-more-text'), loadMoreBtn: $('#load-more-btn'),
  publicView: $('#public-view'), adminView: $('#admin-view'), adminRoot: $('#admin-root'),
  detail: $('#detail-dialog'), detailTitle: $('#detail-title'), detailBody: $('#detail-body'),
  adminDialog: $('#admin-dialog'),
};

function coverEl(r) {
  const wrap = h('div', { class: 'cover' });
  const fallback = () => h('div', { class: 'cover-fallback', 'aria-hidden': 'true' }, icon('doc'));
  const u = safeUrl(r.coverUrl);
  if (u) {
    const img = h('img', { src: u.href, alt: '', loading: 'lazy', decoding: 'async', width: 640, height: 180, referrerpolicy: 'no-referrer' });
    img.addEventListener('error', () => img.replaceWith(fallback()), { once: true });
    wrap.append(img);
  } else wrap.append(fallback());
  return wrap;
}

function openLinkProps(u, label) {
  return { href: u.href, target: '_blank', rel: 'noopener noreferrer', 'aria-label': `${label} ${t('newTab')}` };
}

function primaryAction(r, extraClass = '') {
  const u = safeUrl(r.url);
  if (!u) return h('button', { type: 'button', class: `btn ${extraClass}`, disabled: true }, t('noLink'));
  return h('a', { class: `btn ${extraClass}`, ...openLinkProps(u, `${t('openOnline')}: ${displayTitle(r)}`) }, t('openOnline'), icon('external'));
}

function downloadAction(r) {
  const u = safeUrl(r.downloadUrl);
  if (!u) return null;
  const props = { class: 'btn btn-outline', href: u.href, 'aria-label': `${t('download')}: ${displayTitle(r)}` };
  if (isSameOrigin(u)) props.download = true;
  else { props.target = '_blank'; props.rel = 'noopener noreferrer'; props['aria-label'] += ` ${t('newTab')}`; }
  return h('a', props, icon('download'), t('download'));
}

// การ์ดแบบปุ่มยาว: ภาพปก (กดเปิดลิงก์ได้) + ชื่อรายการ + ปุ่มเปิดดูออนไลน์ + ปุ่มรายละเอียด
// ปุ่มดาวน์โหลดอยู่ในหน้าต่างรายละเอียด
const TONES = 6;
function cardEl(r, index = 0) {
  const titleId = uid('card-title');
  const u = safeUrl(r.url);
  const title = displayTitle(r);
  const thumb = coverEl(r);
  thumb.classList.add('pill-thumb');
  const viewBtn = u
    ? h('a', { class: 'pill-btn', ...openLinkProps(u, `${t('openOnline')}: ${title}`), title: t('openOnline'), html: ICONS.open })
    : h('button', { type: 'button', class: 'pill-btn', disabled: true, 'aria-label': `${t('noLink')}: ${title}`, title: t('noLink'), html: ICONS.open });
  return h('article', { class: `pill tone-${index % TONES}`, 'aria-labelledby': titleId },
    u ? h('a', { class: 'pill-thumb-link', href: u.href, target: '_blank', rel: 'noopener noreferrer', tabindex: '-1', 'aria-hidden': 'true' }, thumb) : thumb,
    h('h3', { class: 'card-title', id: titleId, tabindex: '-1', title },
      u ? h('a', openLinkProps(u, title), title) : title),
    h('div', { class: 'pill-actions' },
      viewBtn,
      h('button', { type: 'button', class: 'pill-btn', 'data-detail': r.id, 'aria-label': `${t('details')}: ${title}`, title: t('details'), html: ICONS.arrow }),
    ),
  );
}

function skeletonCards(n) {
  return Array.from({ length: n }, () => h('div', { class: 'pill skeleton', 'aria-hidden': 'true' },
    h('div', { class: 'pill-thumb' }),
    h('div', { style: 'flex:1;display:flex;flex-direction:column;gap:8px' }, h('div', { class: 'sk-line', style: 'width:70%' }), h('div', { class: 'sk-line', style: 'width:40%' })),
    h('div', { class: 'pill-actions' }, h('div', { class: 'sk-circle' }), h('div', { class: 'sk-circle' })),
  ));
}

function statePanel({ title, text, error = false, action }) {
  return h('div', { class: `state-panel${error ? ' error' : ''}`, role: error ? 'alert' : null },
    h('h3', null, title), text ? h('p', null, text) : null, action || null);
}

function renderPublic() {
  els.resultsState.replaceChildren();
  els.grid.replaceChildren();
  els.loadMore.hidden = true;
  els.resultHead.hidden = !state.q || state.load !== 'ready';

  if (state.load === 'loading' || state.load === 'idle') {
    els.listStatus.textContent = t('loading');
    els.grid.append(...skeletonCards(6));
    return;
  }
  if (state.load === 'error') {
    els.resultsState.append(statePanel({
      title: t('loadFailed'), text: state.error, error: true,
      action: h('button', { type: 'button', class: 'btn', onclick: () => loadPublicData() }, t('retry')),
    }));
    return;
  }
  if (!state.resources.length) {
    els.resultsState.append(statePanel({ title: t('emptyTitle'), text: t('emptyText') }));
    return;
  }

  state.results = filteredResults();
  state.shown = 0;
  if (state.q) {
    const [pre, post] = t('searchResult', { n: fmtNum(state.results.length), q: '\u0001' }).split('\u0001');
    els.count.replaceChildren(pre, h('strong', null, state.q), post ?? '');
  }
  els.listStatus.textContent = state.q ? '' : t('totalItems', { n: fmtNum(state.results.length) });
  if (!state.results.length) {
    els.resultsState.append(statePanel({
      title: t('noResultTitle'), text: t('noResultText'),
      action: h('button', { type: 'button', class: 'btn', onclick: clearSearch }, t('clearSearch')),
    }));
    return;
  }
  appendMore();
}

// แสดงการ์ดเพิ่มครั้งละ PAGE_SIZE (ต่อท้าย ไม่วาดใหม่ทั้งหมด เพื่อไม่ให้หน้ากระโดด)
function appendMore() {
  const next = state.results.slice(state.shown, state.shown + CONFIG.PAGE_SIZE);
  els.grid.append(...next.map((r, i) => cardEl(r, state.shown + i)));
  state.shown += next.length;
  const remaining = state.results.length - state.shown;
  els.loadMore.hidden = remaining <= 0;
  if (remaining > 0 && !('IntersectionObserver' in window)) {
    els.loadMoreText.hidden = true;
    els.loadMoreBtn.hidden = false;
  }
  // จอสูงจนจุดโหลดเพิ่มยังอยู่ในระยะ → observer จะไม่แจ้งซ้ำ จึงเช็กเองอีกครั้ง
  if (remaining > 0) requestAnimationFrame(() => {
    if (!els.loadMore.hidden && els.loadMore.getBoundingClientRect().top < innerHeight + 600) appendMore();
  });
}

if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver((entries) => {
    if (entries.some((e) => e.isIntersecting) && !els.loadMore.hidden && state.load === 'ready') appendMore();
  }, { rootMargin: '600px 0px' });
  io.observe(els.loadMore);
}
els.loadMoreBtn.addEventListener('click', () => {
  const first = state.shown;
  appendMore();
  els.grid.children[first]?.querySelector('.card-title')?.focus();
});

/* ---------- ค้นหา (ปุ่มบนแถบด้านบน) ---------- */
function setSearchOpen(open, { focus = true } = {}) {
  els.searchBar.hidden = !open;
  els.searchToggle.setAttribute('aria-expanded', String(open));
  if (open && focus) els.q.focus();
}
function applySearch(v, { replace = false } = {}) {
  v = v.trim().slice(0, 200);
  if (v === state.q) return;
  state.q = v;
  writeUrl({ replace });
  if (els.adminView.hidden) renderPublic();
}
function clearSearch() {
  els.q.value = '';
  lastWasQueryReplace = false;
  applySearch('');
  setSearchOpen(false);
  els.searchToggle.focus();
}

let searchTimer = null;
els.searchToggle.addEventListener('click', () => {
  const open = els.searchBar.hidden;
  if (open && !els.adminView.hidden) { history.pushState(null, '', buildUrl()); route(); }
  setSearchOpen(open);
  if (!open && !state.q) els.searchToggle.focus();
});
els.q.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    applySearch(els.q.value, { replace: lastWasQueryReplace });
    lastWasQueryReplace = true; // พิมพ์ต่อเนื่องแทนที่ history entry เดิม
  }, 250);
});
els.q.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    if (els.q.value) { els.q.value = ''; applySearch(''); } else clearSearch();
  }
});
els.searchBar.addEventListener('submit', (e) => {
  e.preventDefault();
  clearTimeout(searchTimer);
  lastWasQueryReplace = false;
  applySearch(els.q.value, { replace: true });
  els.q.blur();
});
els.searchClear.addEventListener('click', clearSearch);
els.resultClear.addEventListener('click', clearSearch);

/* =====================================================================
   หน้าต่างรายละเอียด
   ===================================================================== */
let detailOpener = null;
let detailPushed = false;
let detailPreview = false;

function detailRow(label, value) {
  return value ? [h('dt', null, label), h('dd', null, value)] : [];
}

function fillDetail(r, { preview = false } = {}) {
  els.detailTitle.textContent = r ? displayTitle(r) : t('notFoundTitle');
  const body = [];
  if (!r) {
    body.push(h('p', { class: 'notice warn', role: 'alert' }, t('notFound')));
    els.detailBody.replaceChildren(...body);
    return;
  }
  if (preview) body.push(h('p', { class: 'notice warn' }, `ตัวอย่างการแสดงผลสำหรับเจ้าหน้าที่ — สถานะปัจจุบัน: ${STATUS_LABEL[r.status] || r.status}`));
  const u = safeUrl(r.url);
  body.push(u ? h('a', { class: 'cover-link', href: u.href, target: '_blank', rel: 'noopener noreferrer', tabindex: '-1', 'aria-hidden': 'true' }, coverEl(r)) : coverEl(r));
  const desc = loc(r, 'description');
  if (desc) body.push(h('p', { class: 'detail-desc' }, desc));
  const rows = [
    ...detailRow(t('category'), catName(r.categoryId)),
    ...detailRow(t('area'), areaLabel(r)),
    ...detailRow(t('languages'), (r.languages || []).map(langLabel).join(', ')),
    ...detailRow(t('source'), r.sourceName),
    ...detailRow(t('edition'), r.edition),
    ...detailRow(t('file'), fileInfo(r)),
    ...detailRow(t('tags'), (r.tags || []).join(', ')),
    ...detailRow(t('verified'), fmtDate(r.verifiedAt)),
    ...detailRow(t('updated'), fmtDate(r.updatedAt)),
  ];
  if (rows.length) body.push(h('dl', { class: 'detail-list' }, ...rows));
  if (u) {
    body.push(h('p', { class: 'hint' }, driveFileId(u.href)
      ? t('hintDrive')
      : isSameOrigin(u) ? t('hintSameSite') : t('hintExternal', { host: u.hostname })));
  }
  const actions = h('div', { class: 'dialog-actions' }, primaryAction(r), downloadAction(r));
  if (!preview) {
    const copyBtn = h('button', { type: 'button', class: 'btn btn-outline' }, t('copyLink'));
    const copyStatus = h('p', { class: 'hint', role: 'status', 'aria-live': 'polite' });
    const shareUrl = `${location.origin}${location.pathname}#resource=${encodeURIComponent(r.id)}`;
    copyBtn.addEventListener('click', async () => {
      try {
        if (!navigator.clipboard?.writeText) throw new Error('no clipboard');
        await navigator.clipboard.writeText(shareUrl);
        copyStatus.textContent = t('copied');
      } catch {
        const input = h('input', { type: 'text', readonly: true, value: shareUrl, id: 'copy-fallback-input' });
        copyStatus.replaceChildren(h('div', { class: 'copy-fallback' },
          h('label', { for: 'copy-fallback-input' }, t('copyManual')), input));
        input.focus(); input.select();
      }
    });
    actions.append(copyBtn);
    body.push(actions, copyStatus);
  } else body.push(actions);
  els.detailBody.replaceChildren(...body);
}

let detailItem = null;
function openDetail(r, { opener = null, push = false, preview = false } = {}) {
  detailItem = r;
  detailOpener = opener;
  detailPreview = preview;
  if (push && r) {
    history.pushState(null, '', buildUrl(`#resource=${encodeURIComponent(r.id)}`));
    detailPushed = true;
  }
  fillDetail(r, { preview });
  detailCleanupDone = false;
  if (!els.detail.open) els.detail.showModal();
  els.detail.scrollTop = 0;
  $('#detail-close').focus();
}

// เก็บกวาดแบบ synchronous (ไม่พึ่ง event 'close' อย่างเดียว) — เรียกซ้ำได้อย่างปลอดภัย
let detailCleanupDone = true;
function onDetailClosed() {
  if (detailCleanupDone) return;
  detailCleanupDone = true;
  const opener = detailOpener;
  detailOpener = null;
  if (!detailPreview && /^#resource=/.test(location.hash)) {
    if (detailPushed) history.back();
    else history.replaceState(null, '', buildUrl());
  }
  detailPushed = false;
  detailPreview = false;
  if (opener && document.contains(opener)) opener.focus();
}
function closeDetail() {
  if (els.detail.open) els.detail.close();
  onDetailClosed();
}
els.detail.addEventListener('close', onDetailClosed);
els.detail.addEventListener('cancel', (e) => { e.preventDefault(); closeDetail(); });
$('#detail-close').addEventListener('click', closeDetail);
els.detail.addEventListener('click', (e) => { if (e.target === els.detail) closeDetail(); });

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-detail]');
  if (!btn) return;
  const r = state.resources.find((x) => x.id === btn.dataset.detail);
  if (r) openDetail(r, { opener: btn, push: true });
});

/* =====================================================================
   Routing (hash): #resource=ID | #admin
   ===================================================================== */
function route() {
  const hash = location.hash;
  if (hash === '#admin') {
    closeDetail();
    showAdmin();
    return;
  }
  showPublic();
  const m = /^#resource=(.+)$/.exec(hash);
  if (m) {
    if (state.load !== 'ready') return; // จะเรียก route() อีกครั้งเมื่อโหลดเสร็จ
    let id;
    try { id = decodeURIComponent(m[1]); } catch { id = ''; }
    const r = state.resources.find((x) => x.id === id) || null;
    if (!els.detail.open) openDetail(r, { push: false });
  } else if (els.detail.open && !detailPreview) {
    closeDetail();
  }
}

function showPublic() {
  const wasAdmin = !els.adminView.hidden;
  els.adminView.hidden = true;
  els.publicView.hidden = false;
  if (wasAdmin) {
    if (state.publicStale) loadPublicData();
    else renderPublic();
  }
}

window.addEventListener('popstate', () => {
  const before = state.q;
  readUrlState();
  lastWasQueryReplace = false;
  if (state.q !== before) {
    // วาดใหม่เฉพาะเมื่อคำค้นเปลี่ยน เพื่อไม่ให้ focus และตำแหน่งการ์ดหาย
    els.q.value = state.q;
    if (state.q) setSearchOpen(true, { focus: false });
    if (els.adminView.hidden) renderPublic();
  }
  route();
});
window.addEventListener('hashchange', route);

/* =====================================================================
   ส่วนเจ้าหน้าที่
   ===================================================================== */
const admin = {
  initialized: false,
  phase: 'idle', // idle | checking | signed-out | denied | ready | error
  user: null,
  error: null,
  tab: 'resources',
  list: [],
  listLoad: 'idle',
  listError: null,
  search: '',
  statusFilter: '',
  savingOrder: false,
  message: null, // { kind, text }
};

$('#admin-back').addEventListener('click', () => {
  history.pushState(null, '', buildUrl());
  route();
  $('#main').focus();
});

async function showAdmin() {
  const first = els.adminView.hidden;
  els.publicView.hidden = true;
  els.adminView.hidden = false;
  if (first) $('#admin-title').focus();
  if (admin.initialized) { renderAdmin(); return; }
  admin.initialized = true;
  if (CONFIG.MODE === 'demo') {
    admin.phase = 'ready';
    await refreshAdminData();
    return;
  }
  admin.phase = 'checking';
  renderAdmin();
  try {
    const repo = await getRepo();
    await repo.onAuthChange(async (user) => {
      admin.user = user;
      admin.list = [];
      admin.listLoad = 'idle';
      if (!user) { admin.phase = 'signed-out'; renderAdmin(); return; }
      admin.phase = 'checking';
      renderAdmin();
      try {
        const ok = await repo.isActiveAdmin(user);
        admin.phase = ok ? 'ready' : 'denied';
        if (ok) await refreshAdminData();
        else renderAdmin();
      } catch (e) {
        console.error(e);
        admin.phase = 'error';
        admin.error = errorMessage(e);
        renderAdmin();
      }
    });
  } catch (e) {
    console.error(e);
    admin.phase = 'error';
    admin.error = errorMessage(e);
    admin.initialized = false;
    renderAdmin();
  }
}

async function refreshAdminData() {
  admin.listLoad = 'loading';
  renderAdmin();
  try {
    const repo = await getRepo();
    const [cats, list] = await Promise.all([repo.listCategories(), repo.adminListResources()]);
    setCategories(cats);
    admin.list = list.sort(defaultCompare);
    admin.listLoad = 'ready';
  } catch (e) {
    console.error(e);
    admin.listLoad = 'error';
    admin.listError = errorMessage(e);
  }
  renderAdmin();
}

function setAdminMessage(kind, text) {
  admin.message = { kind, text };
  renderAdmin();
}

function renderAdmin() {
  const parts = [];
  if (CONFIG.MODE === 'demo') {
    parts.push(h('p', { class: 'notice warn', style: 'margin-bottom:12px' },
      h('strong', null, 'โหมดสาธิต: '),
      'ไม่มีการเข้าสู่ระบบหรือตรวจสิทธิ์จริง การแก้ไขเก็บในหน่วยความจำของเบราว์เซอร์นี้เท่านั้น รีเฟรชหน้าแล้วข้อมูลจะหาย'));
  }
  if (admin.phase === 'checking') {
    parts.push(h('div', { class: 'admin-card', role: 'status' }, 'กำลังตรวจสอบสิทธิ์...'));
  } else if (admin.phase === 'error') {
    parts.push(statePanel({ title: 'ไม่สามารถเปิดส่วนเจ้าหน้าที่ได้', text: admin.error, error: true,
      action: h('button', { type: 'button', class: 'btn', onclick: () => { admin.initialized = false; showAdmin(); } }, 'ลองใหม่') }));
  } else if (admin.phase === 'signed-out') {
    const msg = h('p', { class: 'field-error', role: 'alert' });
    const btn = h('button', { type: 'button', class: 'btn' }, 'เข้าสู่ระบบด้วย Google');
    btn.addEventListener('click', async () => {
      btn.disabled = true; msg.textContent = '';
      try { await (await getRepo()).signIn(); } catch (e) { console.error(e); msg.textContent = errorMessage(e); }
      btn.disabled = false;
    });
    parts.push(h('div', { class: 'admin-card' },
      h('p', { style: 'margin-top:0' }, 'สำหรับเจ้าหน้าที่ที่ได้รับอนุญาตเท่านั้น'),
      btn, msg));
  } else if (admin.phase === 'denied') {
    // แสดง UID ของบัญชีที่เข้าสู่ระบบอยู่ (เฉพาะเจ้าของบัญชีเห็น) เพื่อส่งให้ผู้ดูแลเพิ่มใน admins
    const myUid = admin.user?.uid || '';
    const uidInput = h('input', { type: 'text', id: 'my-uid', readonly: true, value: myUid });
    const copyMsg = h('span', { class: 'hint', role: 'status' });
    const copyBtn = h('button', { type: 'button', class: 'btn btn-outline btn-sm' }, 'คัดลอก UID');
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(myUid); copyMsg.textContent = 'คัดลอกแล้ว'; }
      catch { uidInput.focus(); uidInput.select(); copyMsg.textContent = 'กด Ctrl+C เพื่อคัดลอก'; }
    });
    parts.push(h('div', { class: 'admin-card' },
      h('p', { class: 'notice error', role: 'alert' }, 'บัญชีนี้ไม่มีสิทธิ์เข้าถึงส่วนจัดการ หากเป็นเจ้าหน้าที่ กรุณาส่ง UID ด้านล่างให้ผู้ดูแลโครงการ Firebase เพื่อเพิ่มสิทธิ์'),
      h('p', null, `บัญชีที่เข้าสู่ระบบ: ${admin.user?.email || '-'}`),
      h('div', { class: 'field' }, h('label', { for: 'my-uid' }, 'User UID'),
        h('div', { class: 'inline-row' }, uidInput, copyBtn, copyMsg)),
      h('p', { class: 'hint' }, 'ผู้ดูแลเพิ่มสิทธิ์ที่ Firebase Console → Firestore → collection "admins" → Document ID = UID นี้ → field "active" (boolean) = true แล้วให้ออกจากระบบและเข้าใหม่'),
      h('p', null, signOutButton())));
  } else if (admin.phase === 'ready') {
    parts.push(...adminReadyView());
  }
  els.adminRoot.replaceChildren(...parts);
}

function signOutButton() {
  const b = h('button', { type: 'button', class: 'btn btn-outline btn-sm' }, 'ออกจากระบบ');
  b.addEventListener('click', async () => {
    b.disabled = true;
    try { await (await getRepo()).signOut(); } catch (e) { console.error(e); setAdminMessage('error', errorMessage(e)); }
  });
  return b;
}

function adminReadyView() {
  const out = [];
  const tabBtn = (id, label) => {
    const b = h('button', { type: 'button', class: 'btn btn-sm', 'aria-pressed': String(admin.tab === id) }, label);
    b.addEventListener('click', () => { admin.tab = id; admin.message = null; renderAdmin(); });
    return b;
  };
  out.push(h('div', { class: 'inline-row', style: 'justify-content:space-between;margin-bottom:12px' },
    h('div', { class: 'admin-tabs', role: 'group', 'aria-label': 'เลือกส่วนจัดการ', style: 'margin:0' },
      tabBtn('resources', 'รายการ'), tabBtn('categories', 'หมวดหมู่')),
    CONFIG.MODE === 'firebase' && admin.user
      ? h('div', { class: 'inline-row' }, h('span', { class: 'hint', style: 'margin:0' }, admin.user.email || admin.user.displayName || ''), signOutButton())
      : null));
  out.push(h('div', { class: 'admin-status', role: 'status', 'aria-live': 'polite' },
    admin.message ? h('p', { class: `notice ${admin.message.kind}` }, admin.message.text) : null));

  if (admin.listLoad === 'loading' || admin.listLoad === 'idle') {
    out.push(h('div', { class: 'admin-card', role: 'status' }, 'กำลังโหลดข้อมูล...'));
    return out;
  }
  if (admin.listLoad === 'error') {
    out.push(statePanel({ title: 'โหลดข้อมูลไม่สำเร็จ', text: admin.listError, error: true,
      action: h('button', { type: 'button', class: 'btn', onclick: refreshAdminData }, 'ลองใหม่') }));
    return out;
  }
  out.push(admin.tab === 'resources' ? adminResourcesPanel() : adminCategoriesPanel());
  return out;
}

/* ---------- รายการ: จัดลำดับด้วยการลาก ---------- */
function adminResourcesPanel() {
  const search = h('input', { type: 'search', id: 'adm-search', value: admin.search, placeholder: 'ค้นหาชื่อรายการ...', 'aria-label': 'ค้นหาชื่อรายการ' });
  const statusSel = h('select', { id: 'adm-status', 'aria-label': 'กรองสถานะ' },
    h('option', { value: '' }, 'ทุกสถานะ'),
    ...Object.entries(STATUS_LABEL).map(([v, l]) => h('option', { value: v }, l)));
  statusSel.value = admin.statusFilter;
  const listWrap = h('div');
  const renderRows = () => listWrap.replaceChildren(resourceList());
  search.addEventListener('input', () => { admin.search = search.value; renderRows(); });
  statusSel.addEventListener('change', () => { admin.statusFilter = statusSel.value; renderRows(); });
  renderRows();
  return h('section', { class: 'admin-card', 'aria-label': 'จัดการรายการ' },
    h('div', { class: 'admin-toolbar' },
      h('button', { type: 'button', class: 'btn', onclick: (e) => openResourceForm(null, e.currentTarget) }, '+ เพิ่มรายการ'),
      search, statusSel,
      h('button', { type: 'button', class: 'btn btn-outline', onclick: refreshAdminData }, 'โหลดใหม่'),
    ),
    listWrap);
}

function resourceList() {
  const terms = norm(admin.search).split(/\s+/).filter(Boolean);
  const filtered = !!(terms.length || admin.statusFilter);
  const rows = admin.list
    .filter((r) => !admin.statusFilter || r.status === admin.statusFilter)
    .filter((r) => terms.every((t) => norm(r.title).includes(t)));
  if (!rows.length) return h('p', { class: 'state-panel' }, admin.list.length ? 'ไม่พบรายการ' : 'ยังไม่มีรายการ กด "+ เพิ่มรายการ" เพื่อเริ่ม');
  const canDrag = !filtered && !admin.savingOrder;
  const hint = h('p', { class: 'hint', style: 'margin:0 0 10px' }, filtered
    ? 'ล้างการค้นหาและตัวกรองสถานะก่อน จึงจะจัดลำดับได้'
    : admin.savingOrder ? 'กำลังบันทึกลำดับ...' : 'กดค้างที่รายการ (หรือจับ ⋮⋮) แล้วลากขึ้น–ลงเพื่อจัดลำดับ รายการบนสุดแสดงก่อนบนหน้าเว็บ');
  const ol = h('ol', { class: 'order-list', 'aria-label': 'รายการ เรียงตามลำดับที่แสดงบนหน้าเว็บ' },
    ...rows.map((r, i) => orderItem(r, i, rows.length, canDrag)));
  if (canDrag) enableDragSort(ol);
  return h('div', null, hint, ol);
}

function orderItem(r, index, total, canDrag) {
  const title = r.title || '';
  const label = title || displayTitle(r);
  const u = safeUrl(r.url);
  const thumbUrl = safeUrl(r.coverUrl);
  const thumb = h('div', { class: 'order-thumb', 'aria-hidden': 'true' });
  if (thumbUrl) {
    const img = h('img', { src: thumbUrl.href, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
    img.addEventListener('error', () => img.replaceWith(h('div', { class: 'cover-fallback' }, icon('doc'))), { once: true });
    thumb.append(img);
  } else thumb.append(h('div', { class: 'cover-fallback' }, icon('doc')));
  return h('li', { class: 'order-item', dataset: { id: r.id } },
    h('button', { type: 'button', class: 'drag-handle', disabled: !canDrag, 'aria-label': `ลากเพื่อจัดลำดับ: ${label}`, title: 'ลากเพื่อจัดลำดับ', html: ICONS.grip }),
    h('div', { class: 'move-btns' },
      h('button', { type: 'button', disabled: !canDrag || index === 0, 'aria-label': `เลื่อนขึ้น: ${label}`, onclick: () => moveItem(r.id, -1), html: ICONS.up }),
      h('button', { type: 'button', disabled: !canDrag || index === total - 1, 'aria-label': `เลื่อนลง: ${label}`, onclick: () => moveItem(r.id, 1), html: ICONS.down })),
    thumb,
    h('div', { class: 'order-main' },
      h('div', { class: `order-title${title ? '' : ' empty'}` }, title || `(ไม่มีชื่อ) ${u ? u.hostname : ''}`),
      h('div', { class: 'order-meta' },
        h('span', { class: `badge status-${r.status}` }, STATUS_LABEL[r.status] || r.status),
        u ? h('span', null, u.hostname) : h('span', null, 'ยังไม่มีลิงก์'))),
    h('div', { class: 'order-actions' },
      h('button', { type: 'button', class: 'btn btn-sm btn-outline', onclick: (e) => openResourceForm(r, e.currentTarget), 'aria-label': `แก้ไข: ${label}` }, 'แก้ไข'),
      h('button', { type: 'button', class: 'btn btn-sm btn-ghost', onclick: (e) => openDetail(r, { opener: e.currentTarget, preview: true }), 'aria-label': `ดูตัวอย่าง: ${label}` }, 'ดูตัวอย่าง'),
      r.status !== 'published'
        ? h('button', { type: 'button', class: 'btn btn-sm btn-ghost', onclick: (e) => quickStatus(r, 'published', e.currentTarget), 'aria-label': `เผยแพร่: ${label}` }, 'เผยแพร่')
        : h('button', { type: 'button', class: 'btn btn-sm btn-ghost', onclick: (e) => quickStatus(r, 'draft', e.currentTarget), 'aria-label': `ซ่อน: ${label}` }, 'ซ่อน'),
      r.status !== 'archived'
        ? h('button', { type: 'button', class: 'btn btn-sm btn-danger', onclick: (e) => confirmArchive(r, e.currentTarget), 'aria-label': `เก็บเข้าคลัง: ${label}` }, 'เก็บเข้าคลัง')
        : null),
  );
}

// ลากเพื่อจัดลำดับ: จับที่ ⋮⋮ ลากได้ทันที หรือกดค้างที่แถว ~0.35 วินาที (รองรับเมาส์และนิ้ว)
function enableDragSort(ol) {
  let drag = null; // { li, pointerId, startY, offsetY }
  let press = null; // { li, timer, x, y, pointerId }
  let scrollRaf = 0;
  let lastY = 0;

  const items = () => [...ol.children];
  const cancelPress = () => {
    if (!press) return;
    clearTimeout(press.timer);
    press.li.classList.remove('pressing');
    press = null;
  };

  function start(li, pointerId, y) {
    cancelPress();
    drag = { li, pointerId, startTop: li.getBoundingClientRect().top, startY: y };
    li.classList.add('dragging');
    lastY = y;
    autoScroll();
  }
  function moveTo(y) {
    lastY = y;
    const { li } = drag;
    li.style.transform = '';
    const siblings = items().filter((x) => x !== li);
    let before = null;
    for (const s of siblings) {
      const rect = s.getBoundingClientRect();
      if (y < rect.top + rect.height / 2) { before = s; break; }
    }
    if (before !== li.nextElementSibling || (before === null && li !== ol.lastElementChild)) {
      ol.insertBefore(li, before);
    }
    const rect = li.getBoundingClientRect();
    li.style.transform = `translateY(${Math.max(-rect.height, Math.min(rect.height, y - (rect.top + rect.height / 2)))}px)`;
  }
  function autoScroll() {
    cancelAnimationFrame(scrollRaf);
    if (!drag) return;
    const edge = 70;
    let dy = 0;
    if (lastY < edge) dy = -Math.ceil((edge - lastY) / 6);
    else if (lastY > innerHeight - edge) dy = Math.ceil((lastY - (innerHeight - edge)) / 6);
    if (dy) { scrollBy(0, dy); moveTo(lastY); }
    scrollRaf = requestAnimationFrame(autoScroll);
  }
  function finish(commit) {
    cancelAnimationFrame(scrollRaf);
    if (!drag) return;
    const { li } = drag;
    li.classList.remove('dragging');
    li.style.transform = '';
    drag = null;
    if (commit) saveOrder(items().map((x) => x.dataset.id));
  }

  ol.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || drag) return;
    const li = e.target.closest('.order-item');
    if (!li) return;
    if (e.target.closest('.drag-handle')) {
      e.preventDefault();
      try { ol.setPointerCapture(e.pointerId); } catch { /* ไม่มี pointer จริง */ }
      start(li, e.pointerId, e.clientY);
      return;
    }
    if (e.target.closest('button, a, input, select')) return;
    // กดค้างที่แถว
    press = { li, x: e.clientX, y: e.clientY, pointerId: e.pointerId, timer: setTimeout(() => {
      try { ol.setPointerCapture(e.pointerId); } catch { /* pointer อาจถูกยกเลิกไปแล้ว */ }
      start(li, e.pointerId, press ? press.y : e.clientY);
    }, 350) };
    li.classList.add('pressing');
  });
  ol.addEventListener('pointermove', (e) => {
    if (press && e.pointerId === press.pointerId && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 8) cancelPress();
    if (drag && e.pointerId === drag.pointerId) { e.preventDefault(); moveTo(e.clientY); }
  });
  ol.addEventListener('pointerup', (e) => { cancelPress(); if (drag && e.pointerId === drag.pointerId) finish(true); });
  ol.addEventListener('pointercancel', (e) => { cancelPress(); if (drag && e.pointerId === drag.pointerId) finish(true); });
  // กันหน้าเลื่อน/เมนูกดค้างบนมือถือระหว่างลาก
  ol.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
  ol.addEventListener('contextmenu', (e) => { if (press || drag) e.preventDefault(); });
}

function moveItem(id, delta) {
  const ids = admin.list.map((r) => r.id);
  const i = ids.indexOf(id);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  saveOrder(ids, id);
}

async function saveOrder(orderedIds, focusId = null) {
  const byId = new Map(admin.list.map((r) => [r.id, r]));
  const changes = [];
  orderedIds.forEach((id, i) => {
    const r = byId.get(id);
    const sortOrder = (i + 1) * 10;
    if (r && r.sortOrder !== sortOrder) changes.push({ id, sortOrder, expectedUpdatedAt: r.updatedAt?.getTime() ?? null });
  });
  if (!changes.length) return;
  // แสดงลำดับใหม่ทันที แล้วบันทึกเบื้องหลัง
  admin.list = orderedIds.map((id, i) => ({ ...byId.get(id), sortOrder: (i + 1) * 10 }));
  admin.savingOrder = true;
  admin.message = { kind: 'info', text: 'กำลังบันทึกลำดับ...' };
  renderAdmin();
  try {
    await (await getRepo()).reorder(changes);
    state.publicStale = true;
    admin.message = { kind: 'ok', text: 'บันทึกลำดับแล้ว' };
  } catch (e) {
    console.error(e);
    admin.message = { kind: 'error', text: `บันทึกลำดับไม่สำเร็จ: ${errorMessage(e)} — แสดงลำดับล่าสุดจากฐานข้อมูลแล้ว` };
  }
  admin.savingOrder = false;
  await refreshAdminData();
  if (focusId) els.adminRoot.querySelector(`.order-item[data-id="${CSS.escape(focusId)}"] .drag-handle`)?.focus();
}

async function quickStatus(r, status, btn) {
  btn.disabled = true;
  try {
    await (await getRepo()).saveResource(r.id, { ...pickEditable(r), status }, r.updatedAt?.getTime() ?? null);
    state.publicStale = true;
    admin.message = { kind: 'ok', text: `เปลี่ยนสถานะ "${displayTitle(r)}" เป็น ${STATUS_LABEL[status]} แล้ว` };
    await refreshAdminData();
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    setAdminMessage('error', `บันทึกไม่สำเร็จ: ${errorMessage(e)}`);
  }
}

/* ---------- dialog helper ---------- */
let adminDialogOpener = null;
let adminDialogBusy = false;
let adminCleanupDone = true;
function openAdminDialog(title, content, opener) {
  adminDialogOpener = opener || null;
  els.adminDialog.replaceChildren(
    h('div', { class: 'dialog-head' },
      h('h2', { id: 'admin-dialog-title' }, title),
      h('button', { type: 'button', class: 'btn btn-ghost', 'aria-label': 'ปิด', onclick: () => closeAdminDialog(), html: ICONS.close })),
    content);
  adminCleanupDone = false;
  if (!els.adminDialog.open) els.adminDialog.showModal();
  els.adminDialog.scrollTop = 0;
  const first = els.adminDialog.querySelector('input:not([type=hidden]):not([disabled]), select, textarea');
  (first || els.adminDialog.querySelector('.form-actions button, button')).focus();
}
function onAdminDialogClosed() {
  if (adminCleanupDone) return;
  adminCleanupDone = true;
  const o = adminDialogOpener;
  adminDialogOpener = null;
  if (o && document.contains(o)) o.focus();
  else $('#admin-title')?.focus();
}
function closeAdminDialog() {
  if (adminDialogBusy) return;
  if (els.adminDialog.open) els.adminDialog.close();
  onAdminDialogClosed();
}
els.adminDialog.addEventListener('cancel', (e) => { e.preventDefault(); closeAdminDialog(); });
els.adminDialog.addEventListener('close', onAdminDialogClosed);

/* ---------- resource form (ไม่มีช่องบังคับกรอก) ---------- */
function field(id, label, control, { hint, full } = {}) {
  return h('div', { class: `field${full ? ' full' : ''}` },
    h('label', { for: id }, label), control,
    hint ? h('p', { class: 'hint', id: `${id}-hint` }, hint) : null,
    h('p', { class: 'field-error', id: `${id}-err`, hidden: true }));
}

function openResourceForm(r, opener) {
  const isNew = !r;
  const minOrder = admin.list.reduce((m, x) => Math.min(m, Number.isInteger(x.sortOrder) ? x.sortOrder : 0), 10);
  const data = r ? pickEditable(r) : {
    title: '', description: '', type: 'link', categoryId: null, url: null, downloadUrl: null, coverUrl: null,
    province: 'เชียงราย', district: null, languages: [], tags: [], sourceName: '', edition: null,
    fileType: null, fileSizeBytes: null, featured: false, sortOrder: Math.max(-1000000, minOrder - 10), // รายการใหม่อยู่บนสุด
    status: 'published', verifiedAt: null,
  };
  const loadedUpdatedAt = r?.updatedAt?.getTime() ?? null;

  const inp = (id, value, attrs = {}) => h('input', { id, value: value ?? '', ...attrs });
  const fTitle = inp('f-title', data.title, { type: 'text', maxlength: 160 });
  const fTitleEn = inp('f-titleEn', data.titleEn, { type: 'text', maxlength: 160, lang: 'en' });
  const fDescEn = h('textarea', { id: 'f-descriptionEn', maxlength: 2000, lang: 'en' });
  fDescEn.value = data.descriptionEn || '';
  const fUrl = inp('f-url', data.url, { type: 'url', inputmode: 'url', placeholder: 'https://' });
  const fDownload = inp('f-downloadUrl', data.downloadUrl, { type: 'url', inputmode: 'url', placeholder: 'https://' });
  const fCover = inp('f-coverUrl', data.coverUrl, { type: 'url', inputmode: 'url', placeholder: 'https://' });
  const fDesc = h('textarea', { id: 'f-description', maxlength: 2000 });
  fDesc.value = data.description;
  const fStatus = h('select', { id: 'f-status' }, ...Object.entries(STATUS_LABEL).map(([v, l]) => h('option', { value: v }, l)));
  fStatus.value = data.status;

  const catOptions = state.categories.filter((c) => c.active || c.id === data.categoryId);
  const fCat = h('select', { id: 'f-categoryId' }, h('option', { value: '' }, '— ไม่ระบุ —'),
    ...catOptions.map((c) => h('option', { value: c.id }, c.active ? c.name : `${c.name} (ปิดใช้งาน)`)));
  fCat.value = data.categoryId || '';
  const fProvince = inp('f-province', data.province, { type: 'text', maxlength: 100 });
  const fDistrict = inp('f-district', data.district, { type: 'text', maxlength: 100, list: 'district-list' });
  const districtList = h('datalist', { id: 'district-list' }, ...CHIANG_RAI_DISTRICTS.map((d) => h('option', { value: d })));
  const langBoxes = Object.entries(LANGS).map(([code, label]) => h('label', { class: 'check' },
    h('input', { type: 'checkbox', name: 'lang', value: code, checked: data.languages.includes(code) }), h('span', { lang: code }, label)));
  const fLangs = h('fieldset', { class: 'check-group', id: 'f-languages' }, h('legend', null, 'ภาษา'), ...langBoxes);
  const fTags = inp('f-tags', data.tags.join(', '), { type: 'text' });
  const fSource = inp('f-sourceName', data.sourceName, { type: 'text', maxlength: 200 });
  const fEdition = inp('f-edition', data.edition, { type: 'text', maxlength: 100 });
  const fFileSize = inp('f-fileSizeBytes', data.fileSizeBytes ? +(data.fileSizeBytes / 1048576).toFixed(2) : '', { type: 'number', min: '0.01', step: '0.01', inputmode: 'decimal' });
  const fVerified = inp('f-verifiedAt', toDateInput(data.verifiedAt), { type: 'date' });
  const verifyToday = h('button', { type: 'button', class: 'btn btn-outline btn-sm' }, 'วันนี้');
  verifyToday.addEventListener('click', () => { fVerified.value = toDateInput(new Date()); });

  // ลิงก์ Google Drive: แปลง URL หลักเป็นลิงก์อ่าน (/view) และเติมลิงก์ดาวน์โหลดให้อัตโนมัติ
  const driveTest = h('a', { target: '_blank', rel: 'noopener noreferrer', class: 'btn btn-outline btn-sm' }, 'ทดสอบเปิดลิงก์', icon('external'));
  const driveNote = h('div', { class: 'notice info', hidden: true },
    h('p', { style: 'margin:0 0 6px' }, h('strong', null, 'ลิงก์ Google Drive: '),
      'ระบบแปลงเป็นลิงก์เปิดดู (/view) และเติมลิงก์ดาวน์โหลดให้แล้ว ตรวจว่าไฟล์แชร์เป็น "ทุกคนที่มีลิงก์" (ผู้มีสิทธิ์อ่าน) และลองเปิดในหน้าต่างไม่ระบุตัวตน (Incognito) ก่อนเผยแพร่'),
    driveTest);
  const syncDriveNote = () => {
    const vid = driveFileId(fUrl.value);
    const id = vid || driveFileId(fDownload.value);
    driveNote.hidden = !id;
    if (id) driveTest.href = vid ? driveViewUrl(vid) : driveDownloadUrl(id);
  };
  const normalizeDrive = () => {
    const id = driveFileId(fUrl.value);
    if (id) {
      fUrl.value = driveViewUrl(id);
      if (!fDownload.value.trim()) fDownload.value = driveDownloadUrl(id);
    }
    const dId = driveFileId(fDownload.value);
    if (dId) fDownload.value = driveDownloadUrl(dId);
    syncDriveNote();
  };
  fUrl.addEventListener('change', normalizeDrive);
  fDownload.addEventListener('change', normalizeDrive);
  syncDriveNote();

  const summary = h('div', { role: 'alert', 'aria-live': 'assertive' });
  const saveBtn = h('button', { type: 'submit', class: 'btn' }, 'บันทึก');
  const previewBtn = h('button', { type: 'button', class: 'btn btn-outline' }, 'ดูตัวอย่าง');
  const cancelBtn = h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => closeAdminDialog() }, 'ยกเลิก');

  const collect = () => {
    normalizeDrive();
    const nz = (v) => { const s = v.trim(); return s ? s : null; };
    const sizeMb = parseFloat(fFileSize.value);
    const url = nz(fUrl.value);
    const isPdfUrl = !!url && /\.pdf$/i.test(safeUrl(url)?.pathname || '');
    return {
      ...data,
      title: fTitle.value.trim(),
      titleEn: fTitleEn.value.trim(),
      description: fDesc.value.trim(),
      descriptionEn: fDescEn.value.trim(),
      categoryId: fCat.value || null,
      url,
      downloadUrl: nz(fDownload.value),
      coverUrl: nz(fCover.value),
      province: fProvince.value.trim(),
      district: nz(fDistrict.value),
      languages: langBoxes.map((l) => l.querySelector('input')).filter((i) => i.checked).map((i) => i.value),
      tags: [...new Set(fTags.value.split(/[,，]/).map((t) => t.trim()).filter(Boolean))],
      sourceName: fSource.value.trim(),
      edition: nz(fEdition.value),
      // ชนิดไฟล์: ลิงก์ .pdf = PDF / ลิงก์ Google Drive คงค่าเดิม / อื่น ๆ = ไม่ระบุ
      fileType: isPdfUrl ? 'PDF' : (url && driveFileId(url) ? data.fileType : null),
      fileSizeBytes: fFileSize.value.trim() === '' ? null : (isFinite(sizeMb) ? Math.round(sizeMb * 1048576) : NaN),
      status: fStatus.value,
      verifiedAt: fromDateInput(fVerified.value),
    };
  };

  const fieldIds = {
    title: 'f-title', titleEn: 'f-titleEn', description: 'f-description', descriptionEn: 'f-descriptionEn', url: 'f-url', downloadUrl: 'f-downloadUrl', coverUrl: 'f-coverUrl',
    province: 'f-province', district: 'f-district', tags: 'f-tags', sourceName: 'f-sourceName', edition: 'f-edition',
    fileSizeBytes: 'f-fileSizeBytes',
  };
  const showErrors = (errs) => {
    for (const [k, id] of Object.entries(fieldIds)) {
      const el = form.querySelector(`#${id}`);
      const err = form.querySelector(`#${id}-err`);
      if (!el || !err) continue;
      if (errs[k]) {
        el.setAttribute('aria-invalid', 'true');
        el.setAttribute('aria-describedby', `${id}-err`);
        err.textContent = errs[k]; err.hidden = false;
      } else {
        el.removeAttribute('aria-invalid');
        err.hidden = true; err.textContent = '';
      }
    }
  };

  previewBtn.addEventListener('click', () => {
    const d = collect();
    openDetail({ ...d, id: r?.id || 'preview', updatedAt: r?.updatedAt || null }, { opener: previewBtn, preview: true });
  });

  const more = h('details', { class: 'more-fields full' },
    h('summary', null, 'ข้อมูลเพิ่มเติม (ไม่บังคับ)'),
    h('div', { class: 'form-grid' },
      field('f-categoryId', 'หมวดหมู่', fCat, catOptions.length ? {} : { hint: 'ยังไม่มีหมวดหมู่ — เพิ่มได้ที่แท็บ "หมวดหมู่"' }),
      field('f-sourceName', 'แหล่งข้อมูล / ผู้จัดทำ', fSource),
      field('f-province', 'จังหวัด', fProvince),
      h('div', { class: 'field' }, h('label', { for: 'f-district' }, 'อำเภอ / พื้นที่'), fDistrict, districtList,
        h('p', { class: 'field-error', id: 'f-district-err', hidden: true })),
      h('div', { class: 'full' }, fLangs),
      field('f-tags', 'แท็ก (ใช้ค้นหา)', fTags, { hint: 'คั่นด้วยจุลภาค ไม่เกิน 10 แท็ก' }),
      field('f-edition', 'ปี / รุ่นเอกสาร', fEdition),
      field('f-fileSizeBytes', 'ขนาดไฟล์ (MB)', fFileSize),
      h('div', { class: 'field' }, h('label', { for: 'f-verifiedAt' }, 'วันที่ตรวจสอบลิงก์'),
        h('div', { class: 'inline-row' }, fVerified, verifyToday)),
    ));
  // เปิดส่วนข้อมูลเพิ่มเติมไว้ถ้ารายการนี้มีข้อมูลในส่วนนั้นอยู่แล้ว
  if (data.categoryId || data.sourceName || data.district || data.languages.length || data.tags.length || data.edition || data.fileSizeBytes || data.verifiedAt) more.open = true;

  const form = h('form', { novalidate: true },
    h('div', { class: 'dialog-body' },
      summary,
      h('div', { class: 'form-grid' },
        field('f-title', 'ชื่อรายการ (ไทย)', fTitle, { full: true }),
        field('f-titleEn', 'ชื่อรายการ (English)', fTitleEn, { full: true, hint: 'แสดงเมื่อผู้ใช้เลือก EN — เว้นว่างได้ ระบบจะแสดงชื่อภาษาไทยแทน' }),
        field('f-url', 'ลิงก์สำหรับ "เปิดดูออนไลน์"', fUrl, { full: true, hint: 'ลิงก์เว็บไซต์ ไฟล์ PDF หรือรูปภาพ (https://) วางลิงก์แชร์ Google Drive ได้เลย ระบบจะแปลงให้' }),
        h('div', { class: 'full' }, driveNote),
        field('f-downloadUrl', 'ลิงก์ดาวน์โหลด', fDownload, { full: true, hint: 'เว้นว่างได้ — ถ้าว่างจะไม่แสดงปุ่มดาวน์โหลด' }),
        field('f-coverUrl', 'ลิงก์ภาพปก', fCover, { full: true, hint: 'เว้นว่างได้ — ถ้าว่างจะแสดงภาพสำรอง' }),
        field('f-description', 'คำอธิบาย (ไทย)', fDesc, { full: true, hint: 'แสดงในหน้ารายละเอียด (ข้อมูลที่เผยแพร่อ่านได้สาธารณะ ห้ามใส่ข้อมูลภายใน)' }),
        field('f-descriptionEn', 'คำอธิบาย (English)', fDescEn, { full: true, hint: 'เว้นว่างได้ ระบบจะแสดงคำอธิบายภาษาไทยแทน' }),
        field('f-status', 'สถานะ', fStatus, { hint: 'เผยแพร่ = แสดงบนหน้าเว็บ / ฉบับร่าง = ซ่อนไว้ / เก็บเข้าคลัง = เลิกใช้' }),
        more,
      ),
    ),
    h('div', { class: 'form-actions' }, saveBtn, previewBtn, cancelBtn),
  );

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (adminDialogBusy) return;
    const d = collect();
    const errs = validateResource(d);
    showErrors(errs);
    summary.replaceChildren();
    if (Object.keys(errs).length) {
      summary.append(h('p', { class: 'notice error' }, `กรุณาแก้ไข ${Object.keys(errs).length} ช่องที่รูปแบบไม่ถูกต้อง`));
      const firstKey = Object.keys(fieldIds).find((k) => errs[k]);
      const el = form.querySelector(`#${fieldIds[firstKey]}`);
      if (el?.closest('details')) el.closest('details').open = true;
      el?.focus();
      return;
    }
    adminDialogBusy = true;
    saveBtn.disabled = true; previewBtn.disabled = true; cancelBtn.disabled = true;
    saveBtn.textContent = 'กำลังบันทึก...';
    try {
      await (await getRepo()).saveResource(r?.id || null, d, loadedUpdatedAt);
      adminDialogBusy = false;
      state.publicStale = true;
      admin.message = { kind: 'ok', text: `${isNew ? 'เพิ่ม' : 'บันทึก'} "${displayTitle(d)}" แล้ว` };
      closeAdminDialog();
      await refreshAdminData();
    } catch (err) {
      console.error(err);
      adminDialogBusy = false;
      saveBtn.disabled = false; previewBtn.disabled = false; cancelBtn.disabled = false;
      saveBtn.textContent = 'บันทึก';
      const box = h('div', { class: 'notice error' }, h('p', { style: 'margin:0 0 6px' }, `บันทึกไม่สำเร็จ: ${errorMessage(err)} ข้อมูลในฟอร์มยังอยู่ ลองใหม่ได้`));
      if (err.code === 'timeout') box.append(h('p', { style: 'margin:0 0 6px' }, 'ระบบไม่ได้รับคำยืนยันจากเซิร์ฟเวอร์ กรุณาตรวจรายการหลังโหลดใหม่ก่อนบันทึกซ้ำ เพื่อป้องกันรายการซ้ำ'));
      if (err.code === 'conflict' && r) {
        const reload = h('button', { type: 'button', class: 'btn btn-outline btn-sm' }, 'โหลดข้อมูลล่าสุด (ทิ้งการแก้ไขในฟอร์ม)');
        reload.addEventListener('click', async () => {
          reload.disabled = true;
          try {
            const fresh = await (await getRepo()).getResource(r.id);
            openResourceForm(fresh, adminDialogOpener);
          } catch (e2) { reload.disabled = false; box.append(h('p', null, errorMessage(e2))); }
        });
        box.append(reload);
      }
      summary.replaceChildren(box);
      summary.scrollIntoView({ block: 'nearest' });
    }
  });

  openAdminDialog(isNew ? 'เพิ่มรายการ' : 'แก้ไขรายการ', form, opener);
}

/* ---------- archive confirm ---------- */
function confirmArchive(r, opener) {
  const ok = h('button', { type: 'submit', class: 'btn btn-danger' }, 'เก็บเข้าคลัง');
  const msg = h('div', { role: 'alert' });
  const form = h('form', null,
    h('div', { class: 'dialog-body' },
      h('p', { style: 'margin:0' }, `เก็บ "${displayTitle(r)}" เข้าคลัง? รายการจะหายจากหน้าเว็บ แต่ยังอยู่ในระบบและนำกลับมาเผยแพร่ได้`),
      h('p', { class: 'hint' }, 'ไฟล์ที่อยู่บน GitHub Pages หรือ Google Drive ยังเปิดได้ถ้ารู้ลิงก์ การเก็บเข้าคลังไม่ได้ลบไฟล์'),
      msg),
    h('div', { class: 'form-actions' }, ok, h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => closeAdminDialog() }, 'ยกเลิก')));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (adminDialogBusy) return;
    adminDialogBusy = true; ok.disabled = true; ok.textContent = 'กำลังบันทึก...';
    try {
      await (await getRepo()).saveResource(r.id, { ...pickEditable(r), status: 'archived' }, r.updatedAt?.getTime() ?? null);
      adminDialogBusy = false;
      state.publicStale = true;
      admin.message = { kind: 'ok', text: `เก็บ "${displayTitle(r)}" เข้าคลังแล้ว` };
      closeAdminDialog();
      await refreshAdminData();
    } catch (err) {
      console.error(err);
      adminDialogBusy = false; ok.disabled = false; ok.textContent = 'เก็บเข้าคลัง';
      msg.replaceChildren(h('p', { class: 'notice error' }, `บันทึกไม่สำเร็จ: ${errorMessage(err)}`));
    }
  });
  openAdminDialog('ยืนยันเก็บเข้าคลัง', form, opener);
}

/* ---------- categories ---------- */

  const usage = new Map();
  for (const r of admin.list) if (r.categoryId) usage.set(r.categoryId, (usage.get(r.categoryId) || 0) + 1);
  const rows = state.categories.map((c) => h('tr', null,
    h('td', { class: 'td-title' }, c.name),
    h('td', null, h('span', { class: `badge ${c.active ? 'status-published' : 'status-archived'}` }, c.active ? 'ใช้งาน' : 'ปิดใช้งาน')),
    h('td', null, String(usage.get(c.id) || 0)),
    h('td', null, h('div', { class: 'row-actions' },
      h('button', { type: 'button', class: 'btn btn-sm btn-outline', onclick: (e) => openCategoryForm(c, e.currentTarget), 'aria-label': `แก้ไขหมวดหมู่: ${c.name}` }, 'แก้ไข'))),
  ));
  return h('section', { class: 'admin-card', 'aria-label': 'จัดการหมวดหมู่' },
    h('div', { class: 'admin-toolbar' },
      h('button', { type: 'button', class: 'btn', onclick: (e) => openCategoryForm(null, e.currentTarget) }, '+ เพิ่มหมวดหมู่'),
      h('p', { class: 'hint', style: 'margin:0' }, 'หมวดหมู่ใช้ในหน้ารายละเอียดและการค้นหา ลบไม่ได้ ให้ปิดใช้งานแทน')),
    state.categories.length
      ? h('div', { class: 'table-wrap' }, h('table', null,
        h('caption', { class: 'sr-only' }, 'ตารางหมวดหมู่'),
        h('thead', null, h('tr', null, ...['ชื่อหมวดหมู่', 'สถานะ', 'จำนวนรายการ', 'จัดการ'].map((t) => h('th', { scope: 'col' }, t)))),
        h('tbody', null, ...rows)))
      : h('div', { class: 'state-panel' },
        h('p', null, `ยังไม่มีหมวดหมู่ แนะนำหมวดหมู่เริ่มต้น: ${DEFAULT_CATEGORY_NAMES.join(', ')}`),
        h('button', { type: 'button', class: 'btn', onclick: (e) => addDefaultCategories(e.currentTarget) }, `เพิ่มหมวดหมู่เริ่มต้น ${DEFAULT_CATEGORY_NAMES.length} รายการ`)));
}

// เพิ่มหมวดหมู่เริ่มต้นทีละรายการ (ข้ามชื่อที่มีอยู่แล้ว)
async function addDefaultCategories(btn) {
  btn.disabled = true;
  btn.textContent = 'กำลังเพิ่มหมวดหมู่...';
  const repo = await getRepo();
  const existing = new Set(state.categories.map((c) => norm(c.name)));
  let added = 0;
  try {
    for (const [i, name] of DEFAULT_CATEGORY_NAMES.entries()) {
      if (existing.has(norm(name))) continue;
      await repo.saveCategory(null, { name, nameEn: DEFAULT_CATEGORY_NAMES_EN[i], sortOrder: i + 1, active: true }, null);
      added++;
    }
    state.publicStale = true;
    admin.message = { kind: 'ok', text: `เพิ่มหมวดหมู่เริ่มต้น ${added} รายการแล้ว` };
  } catch (err) {
    console.error(err);
    admin.message = { kind: 'error', text: `เพิ่มหมวดหมู่ได้ ${added} รายการ แล้วเกิดข้อผิดพลาด: ${errorMessage(err)}` };
  }
  await refreshAdminData();
}

function openCategoryForm(c, opener) {
  const isNew = !c;
  const name = h('input', { type: 'text', id: 'c-name', value: c?.name || '', maxlength: 80 });
  const nameEn = h('input', { type: 'text', id: 'c-name-en', value: c?.nameEn || '', maxlength: 80, lang: 'en' });
  const active = h('input', { type: 'checkbox', id: 'c-active', checked: c ? c.active : true });
  const msg = h('div', { role: 'alert' });
  const save = h('button', { type: 'submit', class: 'btn' }, 'บันทึก');
  const form = h('form', { novalidate: true },
    h('div', { class: 'dialog-body' },
      h('div', { class: 'field' }, h('label', { for: 'c-name' }, 'ชื่อหมวดหมู่ (ไทย)'), name),
      h('div', { class: 'field' }, h('label', { for: 'c-name-en' }, 'ชื่อหมวดหมู่ (English)'), nameEn,
        h('p', { class: 'hint' }, 'เว้นว่างได้ ระบบจะแสดงชื่อภาษาไทยแทน')),
      h('label', { class: 'check' }, active, 'ใช้งาน (เลือกได้ในฟอร์มรายการ)'),
      msg),
    h('div', { class: 'form-actions' }, save, h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => closeAdminDialog() }, 'ยกเลิก')));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (adminDialogBusy) return;
    const data = { name: name.value.trim(), nameEn: nameEn.value.trim(), sortOrder: c?.sortOrder ?? (state.categories.length + 1), active: active.checked };
    const errs = [];
    if (!data.name || data.name.length > 80) errs.push('กรุณากรอกชื่อหมวดหมู่ภาษาไทย (ไม่เกิน 80 ตัวอักษร)');
    if (data.nameEn.length > 80) errs.push('ชื่อภาษาอังกฤษไม่เกิน 80 ตัวอักษร');
    if (state.categories.some((x) => x.id !== c?.id && norm(x.name) === norm(data.name))) errs.push('มีหมวดหมู่ชื่อนี้อยู่แล้ว');
    if (errs.length) { msg.replaceChildren(h('p', { class: 'notice error' }, errs.join(' / '))); return; }
    adminDialogBusy = true; save.disabled = true; save.textContent = 'กำลังบันทึก...';
    try {
      await (await getRepo()).saveCategory(c?.id || null, data, c?.updatedAt?.getTime() ?? null);
      adminDialogBusy = false;
      state.publicStale = true;
      admin.message = { kind: 'ok', text: `บันทึกหมวดหมู่ "${data.name}" แล้ว` };
      closeAdminDialog();
      await refreshAdminData();
    } catch (err) {
      console.error(err);
      adminDialogBusy = false; save.disabled = false; save.textContent = 'บันทึก';
      msg.replaceChildren(h('p', { class: 'notice error' }, `บันทึกไม่สำเร็จ: ${errorMessage(err)}`));
    }
  });
  openAdminDialog(isNew ? 'เพิ่มหมวดหมู่' : 'แก้ไขหมวดหมู่', form, opener);
}

/* =====================================================================
   เริ่มต้น
   ===================================================================== */
// ข้อความคงที่ในหน้า (data-i18n = textContent, data-i18n-attr = "attr:key;attr:key")
function applyStaticI18n() {
  document.documentElement.lang = LANG;
  document.title = t('docTitle');
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-attr]').forEach((el) => {
    for (const pair of el.dataset.i18nAttr.split(';')) {
      const [attr, key] = pair.split(':');
      el.setAttribute(attr, t(key));
    }
  });
  document.querySelectorAll('.lang-switch [data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  if (CONFIG.MODE === 'demo') {
    const banner = $('#mode-banner');
    banner.replaceChildren(h('strong', null, t('demoBanner')), t('demoMode'));
    banner.hidden = false;
  }
}

function setLang(lang, { save = true } = {}) {
  LANG = lang === 'en' ? 'en' : 'th';
  if (save) { try { localStorage.setItem('cri-lang', LANG); } catch { /* storage ใช้ไม่ได้ */ } }
  applyStaticI18n();
  if (els.adminView.hidden) renderPublic();
  else renderAdmin();
  if (els.detail.open && detailItem) fillDetail(detailItem, { preview: detailPreview });
}
document.querySelectorAll('.lang-switch [data-lang]').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.lang !== LANG) setLang(b.dataset.lang);
}));

function initialLang() {
  const fromUrl = new URLSearchParams(location.search).get('lang');
  if (fromUrl === 'en' || fromUrl === 'th') return fromUrl;
  try {
    const saved = localStorage.getItem('cri-lang');
    if (saved === 'en' || saved === 'th') return saved;
  } catch { /* storage ใช้ไม่ได้ */ }
  return 'th';
}

function renderChrome() {
  setLang(initialLang(), { save: false });
  if (CONFIG.LOGO_URL) {
    const logo = $('#brand-logo');
    logo.addEventListener('load', () => { logo.hidden = false; }, { once: true });
    logo.addEventListener('error', () => { logo.hidden = true; }, { once: true });
    logo.alt = CONFIG.LOGO_ALT || '';
    logo.src = CONFIG.LOGO_URL;
  }
}

renderChrome();
readUrlState();
els.q.value = state.q;
if (state.q) setSearchOpen(true, { focus: false });
renderPublic();
route();
loadPublicData();
</script>
</body>
