<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chiang Rai Information ข้อมูลการท่องเที่ยวเชียงราย โดย การท่องเที่ยวแห่งประเทศไทย (ททท.) สำนักงานเชียงราย</title>
<meta name="description" content="Chiang Rai Information ข้อมูลการท่องเที่ยวเชียงราย โดย การท่องเที่ยวแห่งประเทศไทย (ททท.) สำนักงานเชียงราย — รวมลิงก์และไฟล์ข้อมูลท่องเที่ยวเชียงรายไว้ในที่เดียว">
<meta name="application-name" content="Chiang Rai Information">
<meta name="author" content="การท่องเที่ยวแห่งประเทศไทย (ททท.) สำนักงานเชียงราย">
<meta property="og:title" content="Chiang Rai Information ข้อมูลการท่องเที่ยวเชียงราย">
<meta property="og:description" content="รวมลิงก์และไฟล์ข้อมูลท่องเที่ยวเชียงราย โดย การท่องเที่ยวแห่งประเทศไทย (ททท.) สำนักงานเชียงราย">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1d3557">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap">
<style>
:root {
  /* ธีมสี: น้ำเงินมหาสมุทร (#1d3557 #457b9d #a8dadc #caf0f8 #0077b6) + ชมพู–ส้มจากโลโก้ Amazing Thailand */
  --brand-900: #1d3557;
  --brand-800: #1d3557;
  --brand-700: #457b9d;
  --brand-200: #a8dadc;
  --brand-100: #caf0f8;
  --brand-50: #eef8fb;
  --chip: #f1faee;
  --rainbow: linear-gradient(90deg, #e4007c, #f7941d 35%, #00b4d8 65%, #0077b6 85%, #03045e);
  --bg: #f1f8fa;
  --paper: #ffffff;
  --text: #1d3557;
  --muted: #4d6378;
  --line: #d6e6ec;
  --line-strong: #c6cfdb;
  --danger: #b42318;
  --danger-bg: #fdecea;
  --warn-bg: #fff6dc;
  --warn-text: #5c4300;
  --ok-bg: #e6f4ea;
  --ok-text: #1b5e35;
  --focus: #c77700;
  --radius: 14px;
  --shadow-sm: 0 1px 2px rgba(26, 41, 61, .07);
  --shadow: 0 1px 2px rgba(26, 41, 61, .06), 0 6px 20px rgba(26, 41, 61, .08);
  --font: "Sarabun", "Noto Sans Thai", "Leelawadee UI", "Thonburi", Tahoma, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 16px; line-height: 1.6; overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: var(--brand-800); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
.skip-link { position: absolute; left: 16px; top: -100px; z-index: 100; background: var(--paper); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); }
.skip-link:focus { top: 8px; }
.mode-banner { background: var(--warn-bg); color: var(--warn-text); font-size: 14px; padding: 6px 0; text-align: center; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96);
  backdrop-filter: saturate(1.4) blur(8px);
}
/* แถบสีรุ้งใต้หัวเว็บ (โทนสีสดแบบ Amazing Thailand) */
.site-header::after { content: ''; display: block; height: 4px; background: var(--rainbow); }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; color: inherit; text-decoration: none; }
.brand-logo { height: 46px; width: auto; flex: none; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-name { font-size: 1.3rem; font-weight: 700; line-height: 1.2; color: var(--brand-900); letter-spacing: .1px; }
.brand-sub { font-size: .98rem; font-weight: 500; line-height: 1.35; color: var(--muted); }
.header-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.lang-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.lang-switch button {
  min-width: 44px; height: 38px; padding: 0 10px; border: 0; border-radius: 999px; background: transparent;
  color: var(--muted); font-weight: 600; font-size: .92rem; cursor: pointer; letter-spacing: .3px;
}
.lang-switch button:hover { color: var(--brand-900); }
.lang-switch button[aria-pressed="true"] { background: linear-gradient(115deg, #b8006a, #e4007c); color: #fff; box-shadow: var(--shadow-sm); }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--paper); color: var(--brand-900); cursor: pointer;
}
.icon-btn:hover { background: var(--brand-50); border-color: var(--line-strong); }
.icon-btn[aria-expanded="true"] { background: var(--brand-800); border-color: var(--brand-800); color: #fff; }
.icon-btn svg { width: 22px; height: 22px; }
.search-bar { padding: 0 0 14px; }
.search-field { position: relative; }
.search-field > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
.search-field input[type="search"] {
  width: 100%; height: 48px; padding: 0 48px 0 44px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--bg); font-size: 16px;
}
.search-field input[type="search"]:focus { background: #fff; border-color: var(--brand-700); outline: none; box-shadow: 0 0 0 3px rgba(52,80,122,.2); }
.search-field input::-webkit-search-cancel-button { display: none; }
.search-clear {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.search-clear:hover { background: var(--line); }
.search-clear svg { width: 18px; height: 18px; }

/* ---------- main list ---------- */
main { min-height: 60vh; }
.list-section { padding: 24px 0 8px; }
.result-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin: 0 0 16px; }
.result-head p { margin: 0; color: var(--muted); }
.result-head strong { color: var(--text); }
.grid { display: flex; flex-direction: column; gap: 14px; max-width: 860px; margin: 0 auto; }
.result-head { max-width: 860px; margin-left: auto; margin-right: auto; }

/* ---------- การ์ดแบบปุ่มยาว (pill) ---------- */
.pill {
  display: flex; align-items: center; gap: 18px; min-width: 0;
  --c1: #1d3557; --c2: #3d6f91; --soft: #caf0f8;
  padding: 10px 12px 10px 12px; border-radius: 999px; background: linear-gradient(115deg, var(--c1), var(--c2)); color: #fff;
  box-shadow: 0 2px 4px rgba(26,41,61,.10), 0 8px 22px rgba(26,41,61,.10);
  transition: transform .2s ease, box-shadow .2s ease, background-color .2s ease;
}
.pill:hover { transform: translateY(-2px); filter: brightness(1.08) saturate(1.05); box-shadow: 0 4px 8px rgba(26,41,61,.14), 0 14px 30px rgba(26,41,61,.14); }
.pill-thumb-link { display: block; flex: none; border-radius: 999px; }
.pill .cover.pill-thumb {
  flex: none; width: 140px; height: 70px; aspect-ratio: auto; border-radius: 999px;
  background: var(--soft); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
}
.pill .cover.pill-thumb .cover-fallback { background: var(--soft); color: var(--c2); }
.pill .cover.pill-thumb .cover-fallback svg { width: 28px; height: 28px; }
.pill-thumb-link:hover img { transform: scale(1.05); }
.pill .card-title {
  flex: 1; min-width: 0; margin: 0; color: #fff; font-size: 1.22rem; font-weight: 500; line-height: 1.4;
  -webkit-line-clamp: 2;
}
.pill .card-title a { color: inherit; text-decoration: none; }
.pill .card-title a:hover { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.6); text-underline-offset: 4px; }
.pill-actions { display: flex; gap: 10px; flex: none; }
.pill-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: #fff; color: var(--c2, var(--brand-800));
  cursor: pointer; text-decoration: none; transition: background-color .15s ease, transform .15s ease;
}
.pill-btn svg { width: 24px; height: 24px; }
.pill-btn:hover { background: var(--soft, #fff); transform: scale(1.08); color: var(--c1, var(--brand-900)); }
.pill-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.pill-btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }
/* สีการ์ดหมุนเวียน 6 สี: น้ำเงินมหาสมุทร + ชมพู/แดง/ส้มแบบ Amazing Thailand
   (ตัวอักษรขาวบนทุกสีผ่านเกณฑ์ contrast 4.5:1) */
.tone-0 { --c1: #03045e; --c2: #0077b6; --soft: #caf0f8; }
.tone-1 { --c1: #a0005a; --c2: #d10073; --soft: #fde3f1; }
.tone-2 { --c1: #1d3557; --c2: #3d6f91; --soft: #a8dadc; }
.tone-3 { --c1: #9b1b2a; --c2: #d62839; --soft: #fde2e4; }
.tone-4 { --c1: #023e8a; --c2: #0069a8; --soft: #90e0ef; }
.tone-5 { --c1: #a03d00; --c2: #c24e00; --soft: #ffe8d1; }
.pill .card-title:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
@media (max-width: 600px) {
  .pill { gap: 12px; padding: 8px; }
  .pill .cover.pill-thumb { width: 88px; height: 50px; }
  .pill .card-title { font-size: 1rem; }
  .pill-actions { gap: 6px; }
  .pill-btn { width: 44px; height: 44px; }
  .pill-btn svg { width: 20px; height: 20px; }
}
.skeleton.pill { background: var(--brand-100); box-shadow: none; }
.skeleton.pill .pill-thumb, .skeleton.pill .sk-line, .skeleton.pill .sk-circle { background: linear-gradient(90deg, var(--brand-200) 0%, var(--brand-50) 50%, var(--brand-200) 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
.skeleton.pill .pill-thumb { width: 140px; height: 70px; border-radius: 999px; flex: none; }
.sk-circle { width: 56px; height: 56px; border-radius: 50%; flex: none; }
@media (max-width: 600px) { .skeleton.pill .pill-thumb { width: 88px; height: 50px; } .sk-circle { width: 44px; height: 44px; } }

/* ---------- card ---------- */
.card {
  display: flex; flex-direction: column; min-width: 0; background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-sm);
  transition: box-shadow .2s ease, transform .2s ease;
}
.card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
.cover { aspect-ratio: 32 / 9; background: var(--brand-100); position: relative; overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover-link { display: block; }
.cover-link:hover img { transform: scale(1.03); }
.cover img { transition: transform .3s ease; }
.cover-fallback {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  color: var(--brand-700); background: linear-gradient(135deg, var(--brand-50), var(--brand-200));
}
.cover-fallback svg { width: 34px; height: 34px; opacity: .85; }
.card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.card-title {
  margin: 0; font-size: 1.08rem; font-weight: 600; line-height: 1.45; color: var(--text); overflow-wrap: anywhere;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-title a { color: inherit; text-decoration: none; }
.card-title a:hover { color: var(--brand-800); text-decoration: underline; text-underline-offset: 3px; }
.card-title:focus { outline: none; }
.card-actions { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.card-actions > * { flex: 1 1 auto; }
.card-actions .btn-primary-wide { flex-basis: 100%; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; min-width: 44px; padding: 8px 16px; border-radius: 10px;
  border: 1px solid var(--brand-800); background: var(--brand-800); color: #fff;
  font-weight: 600; text-decoration: none; cursor: pointer; line-height: 1.3; text-align: center;
}
.btn:hover { background: var(--brand-900); border-color: var(--brand-900); color: #fff; }
.btn-outline { background: #fff; color: var(--brand-800); border-color: var(--line-strong); }
.btn-outline:hover { background: var(--brand-50); color: var(--brand-900); border-color: var(--brand-700); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--brand-800); }
.btn-ghost:hover { background: var(--brand-50); color: var(--brand-900); border-color: transparent; }
.btn-danger { background: #fff; color: var(--danger); border-color: #f0c2bd; }
.btn-danger:hover { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
.btn[disabled] { background: #eef1f4; border-color: #e1e6eb; color: #6b7480; cursor: not-allowed; }
.btn-sm { min-height: 40px; padding: 4px 12px; font-size: .92rem; border-radius: 8px; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* skeleton */
.skeleton .cover, .skeleton .sk-line { background: linear-gradient(90deg, #edf0f3 0%, #f6f8fa 50%, #edf0f3 100%); background-size: 200% 100%; animation: shimmer 1.4s infinite linear; }
.sk-line { height: 14px; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

.state-panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 40px 16px; text-align: center; color: var(--muted); }
.state-panel h3 { margin: 0 0 6px; color: var(--text); font-size: 1.12rem; }
.state-panel p { margin: 0 0 16px; }
.state-panel.error { border-color: #f0c2bd; background: var(--danger-bg); color: var(--danger); }
.state-panel.error h3 { color: var(--danger); }
.load-more { display: flex; justify-content: center; align-items: center; min-height: 72px; color: var(--muted); font-size: .95rem; }

/* ---------- dialogs ---------- */
dialog {
  border: 0; border-radius: 16px; padding: 0; width: min(720px, calc(100% - 24px));
  max-height: calc(100% - 24px); background: var(--paper); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(26, 41, 61, .55); }
.dialog-head {
  position: sticky; top: 0; z-index: 2; background: var(--paper); display: flex; align-items: flex-start; gap: 12px;
  justify-content: space-between; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--line);
}
.dialog-head h2 { margin: 0; font-size: 1.2rem; line-height: 1.45; overflow-wrap: anywhere; padding-top: 6px; }
.dialog-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.dialog-body .cover { border-radius: 12px; aspect-ratio: 16 / 7; }
.detail-desc { margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
.detail-list { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; font-size: .96rem; }
.detail-list dt { color: var(--muted); }
.detail-list dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 480px) { .detail-list { grid-template-columns: 1fr; } .detail-list dd { margin-bottom: 6px; } }
.notice { border-radius: 10px; padding: 10px 12px; font-size: .95rem; margin: 0; }
.notice.info { background: var(--brand-50); color: var(--brand-900); }
.notice.warn { background: var(--warn-bg); color: var(--warn-text); }
.notice.error { background: var(--danger-bg); color: var(--danger); }
.notice.ok { background: var(--ok-bg); color: var(--ok-text); }
.dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.copy-fallback { display: flex; flex-direction: column; gap: 6px; }
.hint { font-size: .86rem; color: var(--muted); margin: 4px 0 0; }

/* ---------- footer ---------- */
.site-footer { margin-top: 40px; background: var(--brand-900); color: var(--brand-100); padding: 28px 0; position: relative; }
.site-footer::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--rainbow); }
.site-footer a { color: #fff; display: inline-flex; align-items: center; min-height: 44px; }
.footer-grid { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
.site-footer .footer-org { font-weight: 600; color: #fff; margin: 0 0 14px; }
.site-footer .social-links { justify-content: center; }
.site-footer a.admin-btn {
  gap: 6px; min-height: 36px; padding: 4px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600;
  letter-spacing: .3px; color: var(--brand-200); text-decoration: none; border: 1px solid rgba(255,255,255,.3);
}
.site-footer a.admin-btn:hover { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.6); }
.admin-btn svg { width: 15px; height: 15px; }
.site-footer p { margin: 0; }
.social-links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; }
.site-footer a.social-btn {
  width: 48px; height: 48px; border-radius: 50%; justify-content: center; color: var(--brand-800);
  background: var(--chip); border: 2px solid rgba(0,0,0,.12); transition: transform .15s ease, background-color .15s ease;
}
.site-footer a.social-btn:hover { transform: translateY(-2px); }
.social-btn svg { width: 24px; height: 24px; }
.site-footer a.social-btn:hover { filter: brightness(1.1); }
.s-facebook { background: #1877f2 !important; color: #fff !important; border-color: rgba(255,255,255,.7) !important; }
.s-instagram { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285aeb 90%) !important; color: #fff !important; border-color: rgba(255,255,255,.7) !important; }
.s-email { background: #0077b6 !important; color: #fff !important; border-color: rgba(255,255,255,.7) !important; }
.footer-links { font-size: .92rem; text-align: right; }
.footer-links a { color: #c9d8ea; }

/* ---------- admin ---------- */
.admin-shell { padding: 24px 0; }
.admin-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.admin-top h2 { margin: 0; color: var(--brand-900); font-size: 1.35rem; }
.admin-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.admin-tabs { display: flex; gap: 8px; margin: 0 0 12px; flex-wrap: wrap; }
.admin-tabs .btn[aria-pressed="false"] { background: #fff; color: var(--brand-800); border-color: var(--line-strong); }
.admin-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.admin-toolbar input, .admin-toolbar select { width: auto; flex: 1 1 180px; }
.admin-status:empty { display: none; }
.admin-status { margin-bottom: 12px; }
input[type="search"], input[type="text"], input[type="url"], input[type="number"], input[type="date"], select, textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; font-size: 16px;
}
textarea { min-height: 100px; resize: vertical; }
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.order-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 4px; background: #fff;
  border: 1px solid var(--line); border-radius: 12px; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none;
}
.order-item.dragging { box-shadow: 0 10px 30px rgba(26,41,61,.18); border-color: var(--brand-700); position: relative; z-index: 5; }
.order-item.pressing { background: var(--brand-50); }
.drag-handle {
  flex: none; width: 36px; height: 44px; display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: transparent; color: var(--muted); cursor: grab; touch-action: none; border-radius: 8px;
}
.drag-handle:hover { background: var(--bg); color: var(--text); }
.drag-handle:active { cursor: grabbing; }
.drag-handle[disabled] { cursor: not-allowed; opacity: .35; }
.drag-handle svg { width: 20px; height: 20px; }
.order-thumb { flex: none; width: 64px; height: 36px; border-radius: 6px; overflow: hidden; background: var(--brand-100); }
.order-thumb img, .order-thumb .cover-fallback { width: 100%; height: 100%; object-fit: cover; }
.order-thumb .cover-fallback svg { width: 18px; height: 18px; }

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v; // ใช้กับค่าคงที่ (ICONS) เท่านั้น
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, String(v));
    }
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const HTTPS_URL_RE = /^https:\/\/[A-Za-z0-9.-]+(:[0-9]{1,5})?([/?#]\S*)?$/;
function isValidHttpsUrl(u) {
  if (typeof u !== 'string' || u.length > 2048 || !HTTPS_URL_RE.test(u)) return false;
  try {
    const p = new URL(u);
    return p.protocol === 'https:' && !p.username && !p.password;
  } catch { return false; }
}
function safeUrl(u) { return isValidHttpsUrl(u) ? new URL(u) : null; }

const DRIVE_ID_PATTERNS = [
  /^https:\/\/drive\.google\.com\/file\/d\/([A-Za-z0-9_-]{10,})(?:[/?#]|$)/,
  /^https:\/\/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([A-Za-z0-9_-]{10,})(?:[&#]|$)/,
];
function driveFileId(u) {
  if (typeof u !== 'string') return null;
  const s = u.trim();
  for (const re of DRIVE_ID_PATTERNS) {
    const m = re.exec(s);
    if (m) return m[1];
  }
  return null;
}

function fmtSize(bytes) {
  if (!Number.isInteger(bytes) || bytes <= 0) return null;
  const units = ['B', 'KB', 'MB', 'GB'];
  let v = bytes, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

function validateResource(d) {
  const e = {};
  const urlCheck = (field, v) => {
    if (v == null) return;
    if (!isValidHttpsUrl(v)) e[field] = 'ต้องเป็นลิงก์ที่ขึ้นต้นด้วย https:// ไม่มีช่องว่าง และไม่เกิน 2,048 ตัวอักษร';
    else if (/^https:\/\/github\.com\/[^/]+\/[^/]+\/blob\//.test(v)) e[field] = 'ห้ามใช้ลิงก์หน้า GitHub แบบ /blob/ ให้ใช้ URL ของ GitHub Pages เช่น https://<account>.github.io/<repository>/files/...';
  };
  if (d.title.length > 160) e.title = 'ไม่เกิน 160 ตัวอักษร';
  if (d.titleEn.length > 160) e.titleEn = 'ไม่เกิน 160 ตัวอักษร';
  if (d.description.length > 2000) e.description = 'ไม่เกิน 2,000 ตัวอักษร';
  if (d.descriptionEn.length > 2000) e.descriptionEn = 'ไม่เกิน 2,000 ตัวอักษร';
  urlCheck('url', d.url);
  urlCheck('downloadUrl', d.downloadUrl);
  urlCheck('coverUrl', d.coverUrl);
  if (d.province.length > 100) e.province = 'ไม่เกิน 100 ตัวอักษร';
  if (d.district && d.district.length > 100) e.district = 'ไม่เกิน 100 ตัวอักษร';
  if (d.tags.length > 10) e.tags = 'ไม่เกิน 10 แท็ก';
  else if (d.tags.some((t) => t.length > 40)) e.tags = 'แต่ละแท็กไม่เกิน 40 ตัวอักษร';
  if (d.sourceName.length > 200) e.sourceName = 'ไม่เกิน 200 ตัวอักษร';
  if (d.edition && d.edition.length > 100) e.edition = 'ไม่เกิน 100 ตัวอักษร';
  if (d.fileSizeBytes != null && !(Number.isInteger(d.fileSizeBytes) && d.fileSizeBytes > 0)) e.fileSizeBytes = 'ขนาดไฟล์ต้องมากกว่า 0';
  return e;
}
